RATE</text><text x="585" y="560" font-size="14" fill="#888">PLATFORM</text><g fill="#d72631" font-size="35" font-weight="700"><text x="72" y="604">aws</text><text x="180" y="604">spark</text><text x="310" y="604">trino</text><text x="420" y="604">airflow</text><text x="585" y="604">databricks</text></g></g><rect x="64" y="660" width="1272" height="165" fill="#fff" stroke="#ddd"/><text x="100" y="770" font-family="serif" font-size="90" fill="#d72631" font-weight="700">道</text><g font-family="Arial,sans-serif"><text x="225" y="718" font-size="18" fill="#222" font-weight="700">A SCALABLE SYSTEM IS LIKE A STRONG CREW.</text><text x="225" y="755" font-size="19" fill="#d72631" font-weight="700">TRUST. FLOW. PURPOSE.</text><text x="570" y="710" font-size="17" fill="#222" font-weight="700">☀ LIKE THE SUN</text><text x="570" y="744" font-size="15" fill="#666">Lead with energy. Inspire with impact.</text><text x="850" y="710" font-size="17" fill="#222" font-weight="700">☂ LIKE THE RAIN</text><text x="850" y="744" font-size="15" fill="#666">Stay silent. Keep improving.</text><text x="1120" y="710" font-size="17" fill="#222" font-weight="700">⚔ LIKE A SWORD</text><text x="1120" y="744" font-size="15" fill="#666">Stay sharp. Cut through chaos.</text></g><text x="70" y="870" font-family="monospace" font-size="17" fill="#d72631">aws · trino · iceberg · hudi · spark · airflow · databricks · kafka · python · kubernetes</text></svg>