<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">leemanh — data engineer</title>
  <desc id="desc">Editorial GitHub profile hero in white and red, with sun, rain, and swordline motifs.</desc>
  <defs>
    <radialGradient id="sunHalo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1086 122) rotate(90) scale(120)">
      <stop stop-color="#E12B3D" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#E12B3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F04A59"/>
      <stop offset="1" stop-color="#971A27"/>
    </linearGradient>
    <pattern id="rain" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <line x1="11" y1="0" x2="11" y2="22" stroke="#E7C8CD" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="soft" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
    </style>
  </defs>
  <rect width="1280" height="640" fill="#FCFBF8"/>
  <rect width="1280" height="640" fill="url(#rain)" opacity="0.26"/>
  <rect x="1" y="1" width="1278" height="638" fill="none" stroke="#E8DADB"/>
  <g opacity="0.28" stroke="#C92536" stroke-width="1">
    <path d="M66 84H1214M66 556H1214M66 84V556M1214 84V556"/>
    <path d="M94 112H176M94 112V194M1186 112H1104M1186 112V194M94 528H176M94 528V446M1186 528H1104M1186 528V446"/>
  </g>
  <ellipse cx="1086" cy="122" rx="118" ry="118" fill="url(#sunHalo)">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="6s" repeatCount="indefinite"/>
  </ellipse>
  <g transform="translate(1008 44)">
    <circle cx="78" cy="78" r="58" fill="none" stroke="#D42A3B" stroke-width="3"/>
    <circle cx="78" cy="78" r="32" fill="#D42A3B"/>
    <path d="M78 24C92 45 101 62 101 78C101 94 92 111 78 132C64 111 55 94 55 78C55 62 64 45 78 24Z" fill="#FCFBF8"/>
    <circle cx="78" cy="78" r="4.5" fill="#FCFBF8"/>
    <text x="78" y="146" text-anchor="middle" class="mono" fill="#98646A" font-size="10.5" letter-spacing="2.2">SUN / RAIN / RESOLVE</text>
  </g>
  <g transform="translate(96 78)">
    <circle cx="6" cy="6" r="5" fill="#D42A3B">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="11" class="mono" fill="#AB2030" font-size="13" font-weight="700" letter-spacing="2.8">LEEMANH / DATA ENGINEER</text>
  </g>
  <text x="1122" y="88" text-anchor="end" class="mono" fill="#9A7176" font-size="12" letter-spacing="2">PROFILE / RW</text>
  <g transform="translate(88 190)">
    <text x="4" y="0" class="sans" fill="none" stroke="#E12B3D" stroke-width="1.4" opacity="0.33" font-size="116" font-weight="820" letter-spacing="-6">leemanh</text>
    <text x="0" y="0" class="sans" fill="#161616" font-size="116" font-weight="820" letter-spacing="-6">leemanh</text>
    <text x="4" y="46" class="mono" fill="#7D5D61" font-size="18" letter-spacing="1.1">aws · trino · iceberg · hudi · spark · airflow · databricks</text>
  </g>
  <g transform="translate(92 302)">
    <text x="0" y="0" class="sans" fill="#1F1F1F" font-size="58" font-weight="760" letter-spacing="-2">clear systems.</text>
    <text x="0" y="62" class="sans" fill="#D42A3B" font-size="58" font-weight="820" letter-spacing="-2">sharp edges.</text>
    <text x="2" y="102" class="mono" fill="#7F696D" font-size="15" letter-spacing="1.6">sun-hearted / rain-minded / production-first</text>
  </g>
  <g transform="translate(92 465)">
    <text x="0" y="0" class="mono" fill="#AB2030" font-size="11" font-weight="700" letter-spacing="2.4">OPERATING SURFACE</text>
    <text x="0" y="34" class="sans" fill="#262626" font-size="18" font-weight="650">streaming systems · lakehouse architecture · orchestration · open table formats</text>
    <text x="0" y="61" class="mono" fill="#90777B" font-size="12.5">explicit failure modes · clean interfaces · quiet production</text>
  </g>
  <g transform="translate(804 260)">
    <text x="0" y="0" class="mono" fill="#AB2030" font-size="11" font-weight="700" letter-spacing="2.4">LIVE FLOW</text>
    <path id="flow" d="M0 86H74C116 86 121 40 160 40H247C286 40 296 126 338 126H423C466 126 474 72 516 72H608" fill="none" stroke="#E6C0C6" stroke-width="2.5"/>
    <path d="M0 86H74C116 86 121 40 160 40H247C286 40 296 126 338 126H423C466 126 474 72 516 72H608" fill="none" stroke="#D42A3B" stroke-width="2.5" stroke-dasharray="5 10">
      <animate attributeName="stroke-dashoffset" values="0;-60" dur="4.4s" repeatCount="indefinite"/>
    </path>
    <g fill="#FCFBF8" stroke="#D42A3B" stroke-width="1.8">
      <circle cx="74" cy="86" r="5"/><circle cx="160" cy="40" r="5"/><circle cx="338" cy="126" r="5"/><circle cx="516" cy="72" r="5"/>
    </g>
    <g class="mono" fill="#8D6C70" font-size="10.5" letter-spacing="1.1">
      <text x="48" y="108">ingest</text>
      <text x="138" y="23">stream</text>
      <text x="312" y="150">table</text>
      <text x="494" y="55">serve</text>
    </g>
    <circle r="5.5" fill="#D42A3B" filter="url(#soft)">
      <animateMotion dur="5.6s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion>
    </circle>
  </g>
  <g transform="translate(1030 432)">
    <g transform="rotate(-20 18 56)">
      <rect x="14" y="0" width="9" height="100" rx="4.5" fill="url(#blade)"/>
      <rect x="-5" y="96" width="47" height="8" rx="4" fill="#171717"/>
      <rect x="2" y="106" width="33" height="10" rx="4" fill="#D42A3B"/>
      <rect x="10" y="117" width="17" height="26" rx="7" fill="#171717"/>
    </g>
    <text x="118" y="26" class="mono" fill="#AB2030" font-size="10.5" font-weight="700" letter-spacing="2">SWORD LINE</text>
    <text x="118" y="53" class="sans" fill="#282828" font-size="18" font-weight="650">precision over noise</text>
    <text x="118" y="77" class="sans" fill="#6B6B6B" font-size="14">clean cuts, clean systems</text>
  </g>
  <line x1="66" y1="586" x2="1214" y2="586" stroke="#D9B2B8"/>
  <text x="92" y="614" class="mono" fill="#AB2030" font-size="11" letter-spacing="2.6">WHITE / RED / SUN / RAIN / SWORD / SYSTEMS</text>
  <text x="1176" y="614" text-anchor="end" class="mono" fill="#9A7176" font-size="11" letter-spacing="2">DESIGNED FOR GITHUB PROFILE</text>
</svg>