<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Le Minh Anh — Data Engineer</title>
  <desc id="desc">An animated editorial banner about building reliable data systems.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="580" rx="0"/></clipPath>
    <pattern id="micro" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#222720" stroke-width="1" opacity=".5"/>
    </pattern>
    <filter id="softGlow" x="-200%" y="-200%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fade" x1="0" x2="1">
      <stop stop-color="#D7FF55" stop-opacity="0"/>
      <stop offset=".5" stop-color="#D7FF55" stop-opacity=".18"/>
      <stop offset="1" stop-color="#D7FF55" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace">
    <rect width="1200" height="580" fill="#0B0D0B"/>
    <rect width="1200" height="580" fill="url(#micro)" opacity=".65"/>

    <rect x="-380" y="0" width="380" height="580" fill="url(#fade)" opacity=".75">
      <animate attributeName="x" values="-380;1200" dur="9s" repeatCount="indefinite"/>
    </rect>

    <path d="M34 34H148 M34 34V148 M1166 34H1052 M1166 34V148 M34 546H148 M34 546V432 M1166 546H1052 M1166 546V432" stroke="#32372F" stroke-width="1"/>
    <text x="66" y="74" fill="#D7FF55" font-size="13" letter-spacing="2.4">LE MINH ANH / DATA ENGINEER</text>
    <circle cx="47" cy="69" r="4" fill="#D7FF55">
      <animate attributeName="opacity" values=".25;1;.25" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="1020" y="74" fill="#7F887A" font-size="12" letter-spacing="1.8">PROFILE / 43</text>

    <text x="64" y="205" fill="#F1F4EB" font-family="Arial,Helvetica,sans-serif" font-size="96" font-weight="800" letter-spacing="-5">MOVE DATA.</text>
    <text x="64" y="306" fill="none" stroke="#F1F4EB" stroke-width="1.4" font-family="Arial,Helvetica,sans-serif" font-size="96" font-weight="800" letter-spacing="-5">KEEP TRUTH.</text>
    <text x="64" y="306" fill="#D7FF55" font-family="Arial,Helvetica,sans-serif" font-size="96" font-weight="800" letter-spacing="-5" opacity="0">KEEP TRUTH.
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.55;.58;.64;1" dur="6.8s" repeatCount="indefinite"/>
    </text>

    <g transform="translate(855 128)">
      <line x1="0" y1="0" x2="0" y2="167" stroke="#3A4037"/>
      <text x="26" y="8" fill="#7F887A" font-size="11" letter-spacing="2">WHAT I OPTIMIZE FOR</text>
      <text x="26" y="46" fill="#E4E9DD" font-size="16">change without fear</text>
      <text x="26" y="78" fill="#E4E9DD" font-size="16">failures you can explain</text>
      <text x="26" y="110" fill="#E4E9DD" font-size="16">quiet production nights</text>
      <text x="26" y="155" fill="#D7FF55" font-size="12" letter-spacing="1.5">STREAM / MODEL / ORCHESTRATE</text>
    </g>

    <g transform="translate(64 360)">
      <text x="0" y="0" fill="#7F887A" font-size="11" letter-spacing="2">LIVE SIGNAL</text>
      <path id="signal" d="M0 62 H120 C150 62 150 18 180 18 H330 C360 18 360 88 392 88 H544 C574 88 574 42 606 42 H748 C780 42 780 72 810 72 H1068" fill="none" stroke="#4B5446" stroke-width="1.2"/>
      <path d="M0 62 H120 C150 62 150 18 180 18 H330 C360 18 360 88 392 88 H544 C574 88 574 42 606 42 H748 C780 42 780 72 810 72 H1068" fill="none" stroke="#D7FF55" stroke-width="2.2" stroke-dasharray="3 10" opacity=".9">
        <animate attributeName="stroke-dashoffset" values="0;-52" dur="2.8s" repeatCount="indefinite"/>
      </path>
      <g fill="#0B0D0B" stroke="#788171">
        <circle cx="120" cy="62" r="5"/><circle cx="180" cy="18" r="5"/><circle cx="392" cy="88" r="5"/><circle cx="606" cy="42" r="5"/><circle cx="810" cy="72" r="5"/>
      </g>
      <g fill="#A7B09F" font-size="10" letter-spacing="1">
        <text x="104" y="84">CDC</text><text x="164" y="8">BUS</text><text x="372" y="111">COMPUTE</text><text x="586" y="31">TABLE</text><text x="786" y="95">SERVE</text>
      </g>
      <circle r="5" fill="#D7FF55" filter="url(#softGlow)">
        <animateMotion dur="5.4s" repeatCount="indefinite"><mpath href="#signal"/></animateMotion>
      </circle>
      <circle r="3" fill="#F1F4EB">
        <animateMotion dur="5.4s" begin="-1.8s" repeatCount="indefinite"><mpath href="#signal"/></animateMotion>
      </circle>
      <circle r="3" fill="#F1F4EB">
        <animateMotion dur="5.4s" begin="-3.6s" repeatCount="indefinite"><mpath href="#signal"/></animateMotion>
      </circle>
    </g>

    <line x1="0" y1="512" x2="1200" y2="512" stroke="#30352E"/>
    <g transform="translate(0 538)" font-size="12" letter-spacing="1.6" fill="#AEB6A6">
      <g>
        <text x="0" y="0">PYTHON  ·  SPARK  ·  KAFKA  ·  DEBEZIUM  ·  AIRFLOW  ·  DBT  ·  TRINO  ·  ICEBERG  ·  HUDI  ·  KUBERNETES  ·  </text>
        <text x="1040" y="0">PYTHON  ·  SPARK  ·  KAFKA  ·  DEBEZIUM  ·  AIRFLOW  ·  DBT  ·  TRINO  ·  ICEBERG  ·  HUDI  ·  KUBERNETES  ·  </text>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1040 0" dur="18s" repeatCount="indefinite"/>
      </g>
    </g>
    <rect x="0" y="558" width="1200" height="22" fill="#D7FF55"/>
    <text x="64" y="573" fill="#0B0D0B" font-size="10.5" font-weight="700" letter-spacing="2">BUILD SYSTEMS THAT STAY UNDERSTANDABLE WHEN THEY GET BIG.</text>
  </g>
</svg>