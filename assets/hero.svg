<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="leemanh — data engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0b1728"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1f334a" stroke-width="1" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>

  <circle cx="70" cy="55" r="6" fill="#22d3ee" filter="url(#glow)"/>
  <text x="92" y="62" fill="#88a4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20">pipeline://profile</text>

  <text x="70" y="152" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="72" font-weight="700">leemanh</text>
  <text x="72" y="196" fill="url(#accent)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="600">data engineer // systems-minded builder</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">
    <text x="72" y="264" fill="#7dd3fc">ingest</text>
    <text x="165" y="264" fill="#42566d">→</text>
    <text x="205" y="264" fill="#7dd3fc">transform</text>
    <text x="330" y="264" fill="#42566d">→</text>
    <text x="370" y="264" fill="#7dd3fc">model</text>
    <text x="445" y="264" fill="#42566d">→</text>
    <text x="485" y="264" fill="#7dd3fc">serve</text>
    <text x="555" y="264" fill="#42566d">→</text>
    <text x="595" y="264" fill="#7dd3fc">observe</text>
  </g>

  <rect x="72" y="303" width="10" height="10" rx="5" fill="#34d399" filter="url(#glow)"/>
  <text x="98" y="314" fill="#9fb4c8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16">status: building reliable data systems</text>

  <g transform="translate(865 80)" opacity="0.9">
    <path d="M0 170 C55 140 75 50 140 65 S215 170 270 65" fill="none" stroke="#1e3a55" stroke-width="10" stroke-linecap="round"/>
    <path d="M0 170 C55 140 75 50 140 65 S215 170 270 65" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="0" cy="170" r="7" fill="#22d3ee"/>
    <circle cx="140" cy="65" r="7" fill="#60a5fa"/>
    <circle cx="270" cy="65" r="7" fill="#22d3ee"/>
    <text x="0" y="208" fill="#6f879f" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">raw</text>
    <text x="118" y="42" fill="#6f879f" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">signal</text>
    <text x="238" y="42" fill="#6f879f" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">value</text>
  </g>
</svg>