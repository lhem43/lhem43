name: enhance profile hero

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enhance-profile-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Upscale and sharpen hero
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter, ImageEnhance

          path = Path('assets/profile/profile-hero.webp')
          im = Image.open(path).convert('RGB')
          w, h = im.size
          target_w = max(w, 1920)
          target_h = round(h * target_w / w)
          if target_w != w:
              im = im.resize((target_w, target_h), Image.Resampling.LANCZOS)
          im = ImageEnhance.Contrast(im).enhance(1.035)
          im = im.filter(ImageFilter.UnsharpMask(radius=1.35, percent=165, threshold=2))
          im.save(path, 'WEBP', quality=96, method=6)
          print('hero:', (w, h), '->', im.size, 'bytes:', path.stat().st_size)
          if path.stat().st_size < 100000:
              raise SystemExit('enhanced hero unexpectedly small')
          PY

      - name: Commit enhanced hero
        run: |
          git add assets/profile/profile-hero.webp
          if git diff --cached --quiet; then
            echo 'No hero changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: sharpen profile hero'
          git push
