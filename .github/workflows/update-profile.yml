name: update profile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_profile_svg.py"
      - "scripts/profile_payload/**"
      - "scripts/update_recent_projects.py"
      - ".github/workflows/update-profile.yml"
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild code-drawn profile SVGs
        run: python scripts/build_profile_svg.py
      - name: Update recent public projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_OWNER: lhem43
          PROJECT_LIMIT: "4"
        run: python scripts/update_recent_projects.py
      - name: Commit changes
        run: |
          git add README.md assets/profile/profile-code.svg assets/profile/profile-hero.svg
          if git diff --cached --quiet; then
            echo "No profile changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: rebuild hybrid profile"
          git push
