name: update profile

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/build_profile_hero.py'
      - 'scripts/hero_payload_final/**'
      - 'scripts/update_recent_projects.py'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild approved profile hero
        run: python scripts/build_profile_hero.py

      - name: Update recent public projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_OWNER: lhem43
          PROJECT_LIMIT: '4'
        run: python scripts/update_recent_projects.py

      - name: Commit generated profile
        run: |
          git add assets/profile/profile-hero.webp README.md
          if git diff --cached --quiet; then
            echo 'No profile changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh profile'
          git push
